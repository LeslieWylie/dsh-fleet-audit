name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # tests/boot-check.mjs resolves five harness packages before it will boot
      # a real cordis Context; if any is missing it prints SKIPPED and exits 0,
      # which reads as a green pass while the actual integration check never ran.
      # They're devDependencies (not just peers) so `npm install` alone resolves
      # them. Each is pinned to the exact 0.1.0-rc.6 build rather than a caret
      # range: npm's `latest` tag for this whole harness line still points at the
      # older 0.0.1-rc.1 series, several minors behind what installed profiles
      # actually run.
      - run: npm install
      - run: npm run typecheck
      - run: npm test
        env:
          # Belt and braces for the comment above: the devDependencies make the
          # boot check resolvable today, but if that ever regresses the suite
          # would go back to printing SKIPPED and exiting 0. This turns that
          # state into a failed job, while a bare clone without the harness
          # installed can still run `npm test` normally.
          DSH_BOOT_STRICT: '1'

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `npm install` first because `prepack` runs the TypeScript build, so
      # packing without devDependencies would fail before it packed anything.
      - run: npm install

      # Everything above runs inside this repository, where the harness resolves
      # out of devDependencies. A person installing the published package has
      # none of that, and the two situations disagreed: the harness peers were
      # marked `optional: true` while lib/index.js imports one of them at the
      # top level, so npm installed none of them and the first import threw
      # ERR_MODULE_NOT_FOUND. Every test passed the whole time.
      #
      # This job packs the tarball, installs it into an empty project, and
      # imports it by name — the round trip nothing else here performs. Proved
      # by restoring `optional: true`: exit 1 with it, exit 0 without.
      - run: node scripts/check-install.mjs
